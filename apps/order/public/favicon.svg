<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143618"/>
      <stop offset="50%" stop-color="#1b431f"/>
      <stop offset="100%" stop-color="#0e2611"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c68a4c"/>
      <stop offset="45%" stop-color="#e5b567"/>
      <stop offset="75%" stop-color="#fce29d"/>
      <stop offset="100%" stop-color="#dfa856"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd491"/>
      <stop offset="50%" stop-color="#c68a4c"/>
      <stop offset="100%" stop-color="#f5e1ad"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f3cf7a" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Padi (Rice Stalk) Graphics -->
  <g fill="url(#goldGrad)" stroke="#b87b3e" stroke-width="1.5">
    <!-- Main stem curve -->
    <path d="M 180 395 C 220 375 255 330 270 270 C 285 210 275 160 250 115 C 265 145 272 195 258 245 C 242 300 205 355 170 380 Z" />
    <path d="M 140 375 C 190 355 220 300 230 240 C 235 210 230 180 220 155 C 235 185 240 225 228 265 C 215 310 180 355 135 370 Z" opacity="0.85"/>

    <!-- Grains curving over the crest -->
    <!-- Grain 1 (Top tip) -->
    <path d="M 252 110 C 265 95 285 92 295 105 C 302 115 295 130 280 135 C 265 140 250 125 252 110 Z"/>
    <!-- Grain 2 -->
    <path d="M 278 125 C 298 115 318 118 325 132 C 330 145 320 158 302 160 C 285 162 272 145 278 125 Z"/>
    <!-- Grain 3 -->
    <path d="M 298 150 C 322 142 342 150 348 165 C 352 180 338 192 318 190 C 298 188 288 170 298 150 Z"/>
    <!-- Grain 4 -->
    <path d="M 312 180 C 338 175 358 188 360 205 C 362 220 345 230 322 225 C 302 220 298 200 312 180 Z"/>
    <!-- Grain 5 -->
    <path d="M 315 215 C 342 215 360 232 358 250 C 355 265 338 272 315 262 C 295 252 298 230 315 215 Z"/>
    <!-- Grain 6 -->
    <path d="M 305 252 C 332 258 345 278 338 295 C 332 310 312 312 292 300 C 275 288 282 268 305 252 Z"/>
    <!-- Grain 7 -->
    <path d="M 282 290 C 305 302 315 325 305 340 C 295 352 278 350 260 335 C 245 320 258 300 282 290 Z"/>

    <!-- Inner opposite grain row -->
    <!-- Inner 1 -->
    <path d="M 235 135 C 248 120 265 125 268 138 C 270 150 258 160 242 158 C 230 155 225 145 235 135 Z"/>
    <!-- Inner 2 -->
    <path d="M 250 165 C 268 152 288 160 288 175 C 288 188 275 195 258 190 C 242 185 240 172 250 165 Z"/>
    <!-- Inner 3 -->
    <path d="M 262 200 C 282 190 300 202 298 218 C 295 230 280 235 262 228 C 248 220 248 208 262 200 Z"/>
    <!-- Inner 4 -->
    <path d="M 262 238 C 282 232 298 248 292 262 C 285 275 270 278 255 268 C 242 258 245 245 262 238 Z"/>
  </g>

  <!-- Elegant Brand Typography Curve Accent -->
  <text x="256" y="440" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#fce29d" text-anchor="middle" letter-spacing="4">TEPI SAWAH</text>
  <text x="256" y="465" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#c68a4c" text-anchor="middle" letter-spacing="3">RESTO &amp; CAFE</text>
</svg>